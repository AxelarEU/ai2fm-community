name: Feature Request
description: Suggest a new feature, IDE enhancement, or script step addition
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make `ai2fm` or our native "Vibe Coding" experience better? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. (e.g., "I'm always frustrated when I have to manually type out Insert From URL parameters...")
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you would like the feature or autocomplete to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other workarounds you've been using?
    validations:
      required: false
